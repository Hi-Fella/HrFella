server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter SPA — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable versioned assets shipped by flutter build web
    location ~* \.(js|css|png|woff2|ttf|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
